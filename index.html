<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =========================================================
         VIEWPORT
    ========================================================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =========================================================
         PRIMARY SEO
    ========================================================== -->
    <title id="page-title">Perdana Kurniawan Arta</title>

    <meta
      id="meta-title"
      name="title"
      content="Perdana Kurniawan Arta"
    />

    <meta
      id="meta-description"
      name="description"
      content="Perdana Kurniawan Arta is a designer with 10+ years of experience across visual systems, iconography, illustration, and design direction, now expanding into Product Design and Design Engineering through business thinking, interaction, React, and design in code."
    />

    <meta
      name="author"
      content="Perdana Kurniawan Arta"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <!-- =========================================================
         CANONICAL
    ========================================================== -->
    <link
      id="canonical-link"
      rel="canonical"
      href="https://perdanakun.com/"
    />

    <!-- =========================================================
         FAVICON
    ========================================================== -->
    <link
      id="site-favicon"
      rel="icon"
      type="image/x-icon"
      href="/perdanakun.ico"
    />

    <!-- =========================================================
         OPEN GRAPH
    ========================================================== -->
    <meta
      id="og-type"
      property="og:type"
      content="profile"
    />

    <meta
      id="og-url"
      property="og:url"
      content="https://perdanakun.com/"
    />

    <meta
      id="og-title"
      property="og:title"
      content="Perdana Kurniawan Arta"
    />

    <meta
      id="og-description"
      property="og:description"
      content="Designer with 10+ years of visual design experience, now expanding into Product Design and Design Engineering through business thinking, interaction, React, and design in code."
    />

    <meta
      id="og-site-name"
      property="og:site_name"
      content="Perdana Kurniawan Arta"
    />

    <meta
      id="og-image"
      property="og:image"
      content="https://perdanakun.com/og-image.png"
    />

    <meta
      id="og-image-alt"
      property="og:image:alt"
      content="Portfolio of Perdana Kurniawan Arta"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <!-- =========================================================
         PROFILE CONTEXT
    ========================================================== -->
    <meta
      property="profile:first_name"
      content="Perdana"
    />

    <meta
      property="profile:last_name"
      content="Kurniawan Arta"
    />

    <meta
      property="profile:username"
      content="perdanakun"
    />

    <!-- =========================================================
         TWITTER / X
    ========================================================== -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      id="twitter-title"
      name="twitter:title"
      content="Perdana Kurniawan Arta"
    />

    <meta
      id="twitter-description"
      name="twitter:description"
      content="Designer with 10+ years of visual design experience, now expanding into Product Design and Design Engineering through business thinking, interaction, React, and design in code."
    />

    <meta
      id="twitter-image"
      name="twitter:image"
      content="https://perdanakun.com/og-image.png"
    />

    <!-- =========================================================
         STRUCTURED DATA
         Updated per route by the script below.
    ========================================================== -->
    <script
      id="structured-data"
      type="application/ld+json"
    >
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://perdanakun.com/#website",
            "url": "https://perdanakun.com/",
            "name": "Perdana Kurniawan Arta",
            "alternateName": "Perdanakun",
            "description": "The personal portfolio of Perdana Kurniawan Arta, exploring the intersection of visual design, product thinking, business understanding, interaction, and code.",
            "creator": {
              "@id": "https://perdanakun.com/#perdana-kurniawan-arta"
            }
          },
          {
            "@type": "Person",
            "@id": "https://perdanakun.com/#perdana-kurniawan-arta",
            "name": "Perdana Kurniawan Arta",
            "givenName": "Perdana",
            "familyName": "Kurniawan Arta",
            "alternateName": "Perdanakun",
            "url": "https://perdanakun.com/",
            "jobTitle": "Visual Designer and Design Lead",
            "description": "Perdana Kurniawan Arta is a designer with more than a decade of experience across visual systems, iconography, illustration, digital design, and design direction. He is currently expanding that foundation into Product Design and Design Engineering, combining design craft with business understanding, product thinking, interaction design, React, front-end development, and design in code.",
            "knowsAbout": [
              "Visual Design",
              "Visual Systems",
              "Iconography",
              "Icon Design",
              "Illustration",
              "Graphic Design",
              "Design Direction",
              "Business Thinking",
              "Product Thinking",
              "UI Design",
              "UX Design",
              "Product Design",
              "Interaction Design",
              "Design Systems",
              "Front-End Development",
              "React",
              "Design Engineering",
              "Design in Code"
            ],
            "alumniOf": [
              {
                "@type": "EducationalOrganization",
                "name": "Institut Kesenian Jakarta",
                "url": "https://ikj.ac.id/"
              },
              {
                "@type": "EducationalOrganization",
                "name": "SMK Negeri 2 Salatiga"
              }
            ],
            "sameAs": [
              "https://www.linkedin.com/in/perdanakun/",
              "https://github.com/perdanakun",
              "https://www.instagram.com/perdanakun/",
              "https://medium.com/@perdanakurniawan25",
              "https://www.fiverr.com/conania",
              "https://creativemarket.com/perdanakun"
            ],
            "subjectOf": [
              {
                "@type": "NewsArticle",
                "url": "https://jateng.tribunnews.com/2017/08/17/berburu-dolllar-dengan-desain-logo-remaja-ini-hasilkan-puluhan-juta-rupiah-per-bulan?page=2",
                "headline": "Berburu Dollar dengan Desain Logo, Remaja Ini Hasilkan Puluhan Juta Rupiah per Bulan",
                "datePublished": "2017-08-17",
                "publisher": {
                  "@type": "Organization",
                  "name": "TribunJateng.com"
                }
              }
            ]
          },
          {
            "@type": "WebPage",
            "@id": "https://perdanakun.com/#webpage",
            "url": "https://perdanakun.com/",
            "name": "Perdana Kurniawan Arta",
            "description": "Portfolio of Perdana Kurniawan Arta, a designer combining visual craft, business understanding, product thinking, interaction, and code while expanding into Product Design and Design Engineering.",
            "isPartOf": {
              "@id": "https://perdanakun.com/#website"
            },
            "about": {
              "@id": "https://perdanakun.com/#perdana-kurniawan-arta"
            },
            "mainEntity": {
              "@id": "https://perdanakun.com/#perdana-kurniawan-arta"
            }
          }
        ]
      }
    </script>

    <!-- =========================================================
         ROUTE-SPECIFIC METADATA

         /
         /projects
         /project/:slug
         /gallery
         /writing
         /about
         /computer

         Homepage intentionally keeps only the personal name as
         the browser title. Positioning lives in the content,
         descriptions, and structured data instead.
    ========================================================== -->
    <script>
      (() => {
        const SITE_URL = "https://perdanakun.com";
        const DEFAULT_IMAGE = `${SITE_URL}/og-image.png`;

        const path =
          window.location.pathname.replace(/\/+$/, "") || "/";

        const pageTitle =
          document.getElementById("page-title");

        const metaTitle =
          document.getElementById("meta-title");

        const metaDescription =
          document.getElementById("meta-description");

        const canonical =
          document.getElementById("canonical-link");

        const favicon =
          document.getElementById("site-favicon");

        const ogType =
          document.getElementById("og-type");

        const ogUrl =
          document.getElementById("og-url");

        const ogTitle =
          document.getElementById("og-title");

        const ogDescription =
          document.getElementById("og-description");

        const ogSiteName =
          document.getElementById("og-site-name");

        const ogImage =
          document.getElementById("og-image");

        const ogImageAlt =
          document.getElementById("og-image-alt");

        const twitterTitle =
          document.getElementById("twitter-title");

        const twitterDescription =
          document.getElementById("twitter-description");

        const twitterImage =
          document.getElementById("twitter-image");

        const structuredData =
          document.getElementById("structured-data");

        const projectMeta = {
          travelxxx: {
            title:
              "TravelXXX | Perdana Kurniawan Arta",
            name:
              "TravelXXX",
            description:
              "A Product Design exploration by Perdana Kurniawan Arta focused on reducing uncertainty in hotel search and booking through clearer room, pricing, comparison, and availability decisions.",
            imageAlt:
              "TravelXXX product design project by Perdana Kurniawan Arta"
          },

          "perdana-computer": {
            title:
              "Perdana's Computer | Perdana Kurniawan Arta",
            name:
              "Perdana's Computer",
            description:
              "A Windows 95-inspired interactive portfolio designed and built by Perdana Kurniawan Arta using React, combining product thinking, interaction design, experimentation, and design in code.",
            imageAlt:
              "Perdana's Computer by Perdana Kurniawan Arta"
          },

          holohealth: {
            title:
              "HoloHealth | Perdana Kurniawan Arta",
            name:
              "HoloHealth",
            description:
              "An iconography design system by Perdana Kurniawan Arta translating complex veterinary concepts into a clear, approachable, and scalable visual language.",
            imageAlt:
              "HoloHealth iconography design system by Perdana Kurniawan Arta"
          },

          shipfaster: {
            title:
              "ShipFaster | Perdana Kurniawan Arta",
            name:
              "ShipFaster",
            description:
              "An iconography design system by Perdana Kurniawan Arta created for digital product templates and design systems, exploring reusable components, variants, consistency, and interface scale.",
            imageAlt:
              "ShipFaster iconography design system by Perdana Kurniawan Arta"
          },

          mayora: {
            title:
              "Mayora | Perdana Kurniawan Arta",
            name:
              "Mayora",
            description:
              "Selected visual design work by Perdana Kurniawan Arta for Mayora brands, spanning social media design, scalable visual systems, and long-term audience-facing content.",
            imageAlt:
              "Mayora visual design work by Perdana Kurniawan Arta"
          }
        };

        const buildStructuredData = ({
          title,
          description,
          url,
          pageType = "WebPage",
          projectName = null
        }) => {
          const graph = [
            {
              "@type": "WebSite",
              "@id": `${SITE_URL}/#website`,
              "url": `${SITE_URL}/`,
              "name": "Perdana Kurniawan Arta",
              "alternateName": "Perdanakun",
              "description":
                "The personal portfolio of Perdana Kurniawan Arta, exploring the intersection of visual design, product thinking, business understanding, interaction, and code.",
              "creator": {
                "@id":
                  `${SITE_URL}/#perdana-kurniawan-arta`
              }
            },

            {
              "@type": "Person",
              "@id":
                `${SITE_URL}/#perdana-kurniawan-arta`,
              "name": "Perdana Kurniawan Arta",
              "givenName": "Perdana",
              "familyName": "Kurniawan Arta",
              "alternateName": "Perdanakun",
              "url": `${SITE_URL}/`,
              "jobTitle":
                "Visual Designer and Design Lead",
              "description":
                "Perdana Kurniawan Arta is a designer with more than a decade of experience across visual systems, iconography, illustration, digital design, and design direction. He is currently expanding that foundation into Product Design and Design Engineering, combining design craft with business understanding, product thinking, interaction design, React, front-end development, and design in code.",
              "knowsAbout": [
                "Visual Design",
                "Visual Systems",
                "Iconography",
                "Icon Design",
                "Illustration",
                "Graphic Design",
                "Design Direction",
                "Business Thinking",
                "Product Thinking",
                "UI Design",
                "UX Design",
                "Product Design",
                "Interaction Design",
                "Design Systems",
                "Front-End Development",
                "React",
                "Design Engineering",
                "Design in Code"
              ],
              "alumniOf": [
                {
                  "@type":
                    "EducationalOrganization",
                  "name":
                    "Institut Kesenian Jakarta",
                  "url":
                    "https://ikj.ac.id/"
                },
                {
                  "@type":
                    "EducationalOrganization",
                  "name":
                    "SMK Negeri 2 Salatiga"
                }
              ],
              "sameAs": [
                "https://www.linkedin.com/in/perdanakun/",
                "https://github.com/perdanakun",
                "https://www.instagram.com/perdanakun/",
                "https://medium.com/@perdanakurniawan25",
                "https://www.fiverr.com/conania",
                "https://creativemarket.com/perdanakun"
              ],
              "subjectOf": [
                {
                  "@type": "NewsArticle",
                  "url":
                    "https://jateng.tribunnews.com/2017/08/17/berburu-dolllar-dengan-desain-logo-remaja-ini-hasilkan-puluhan-juta-rupiah-per-bulan?page=2",
                  "headline":
                    "Berburu Dollar dengan Desain Logo, Remaja Ini Hasilkan Puluhan Juta Rupiah per Bulan",
                  "datePublished":
                    "2017-08-17",
                  "publisher": {
                    "@type":
                      "Organization",
                    "name":
                      "TribunJateng.com"
                  }
                }
              ]
            }
          ];

          const webPage = {
            "@type": pageType,
            "@id": `${url}#webpage`,
            "url": url,
            "name": title,
            "description": description,
            "isPartOf": {
              "@id": `${SITE_URL}/#website`
            },
            "about": {
              "@id":
                `${SITE_URL}/#perdana-kurniawan-arta`
            }
          };

          if (projectName) {
            const workId =
              `${url}#creative-work`;

            webPage.mainEntity = {
              "@id": workId
            };

            graph.push({
              "@type": "CreativeWork",
              "@id": workId,
              "url": url,
              "name": projectName,
              "description": description,
              "creator": {
                "@id":
                  `${SITE_URL}/#perdana-kurniawan-arta`
              }
            });
          } else {
            webPage.mainEntity = {
              "@id":
                `${SITE_URL}/#perdana-kurniawan-arta`
            };
          }

          graph.push(webPage);

          return {
            "@context": "https://schema.org",
            "@graph": graph
          };
        };

        const setMeta = ({
          title,
          description,
          url,
          faviconUrl = "/perdanakun.ico",
          siteName = "Perdana Kurniawan Arta",
          type = "website",
          imageUrl = DEFAULT_IMAGE,
          imageAlt,
          structuredTitle = title,
          projectName = null
        }) => {
          document.title = title;

          pageTitle.textContent = title;

          metaTitle.setAttribute(
            "content",
            title
          );

          metaDescription.setAttribute(
            "content",
            description
          );

          canonical.setAttribute(
            "href",
            url
          );

          favicon.setAttribute(
            "href",
            faviconUrl
          );

          ogType.setAttribute(
            "content",
            type
          );

          ogUrl.setAttribute(
            "content",
            url
          );

          ogTitle.setAttribute(
            "content",
            title
          );

          ogDescription.setAttribute(
            "content",
            description
          );

          ogSiteName.setAttribute(
            "content",
            siteName
          );

          ogImage.setAttribute(
            "content",
            imageUrl
          );

          ogImageAlt.setAttribute(
            "content",
            imageAlt
          );

          twitterTitle.setAttribute(
            "content",
            title
          );

          twitterDescription.setAttribute(
            "content",
            description
          );

          twitterImage.setAttribute(
            "content",
            imageUrl
          );

          structuredData.textContent =
            JSON.stringify(
              buildStructuredData({
                title: structuredTitle,
                description,
                url,
                projectName
              })
            );
        };

        /* =====================================================
           PERDANA'S COMPUTER
        ====================================================== */
        if (
          path === "/computer" ||
          path.startsWith("/computer/")
        ) {
          setMeta({
            title:
              "Perdana's Computer",
            structuredTitle:
              "Perdana's Computer",
            description:
              "Perdana's Computer is a Windows 95-inspired interactive portfolio experience by Perdana Kurniawan Arta, exploring visual design, interaction, product thinking, and design in code.",
            url:
              `${SITE_URL}/computer`,
            faviconUrl:
              "/perdana_computer.ico",
            siteName:
              "Perdana's Computer",
            type:
              "website",
            imageAlt:
              "Perdana's Computer by Perdana Kurniawan Arta",
            projectName:
              "Perdana's Computer"
          });

          return;
        }

        /* =====================================================
           PROJECT DETAIL
        ====================================================== */
        if (path.startsWith("/project/")) {
          const slug =
            path.replace("/project/", "").split("/")[0];

          const project =
            projectMeta[slug];

          if (project) {
            setMeta({
              title:
                project.title,
              structuredTitle:
                project.name,
              description:
                project.description,
              url:
                `${SITE_URL}/project/${slug}`,
              faviconUrl:
                "/perdanakun.ico",
              siteName:
                "Perdana Kurniawan Arta",
              type:
                "website",
              imageAlt:
                project.imageAlt,
              projectName:
                project.name
            });

            return;
          }
        }

        /* =====================================================
           PROJECTS
        ====================================================== */
        if (
          path === "/projects" ||
          path.startsWith("/projects/")
        ) {
          setMeta({
            title:
              "Projects | Perdana Kurniawan Arta",
            structuredTitle:
              "Projects by Perdana Kurniawan Arta",
            description:
              "Selected Product Design, Design Engineering, iconography, visual systems, and visual design projects by Perdana Kurniawan Arta.",
            url:
              `${SITE_URL}/projects`,
            faviconUrl:
              "/perdanakun.ico",
            siteName:
              "Perdana Kurniawan Arta",
            type:
              "website",
            imageAlt:
              "Selected projects by Perdana Kurniawan Arta"
          });

          return;
        }

        /* =====================================================
           GALLERY
        ====================================================== */
        if (
          path === "/gallery" ||
          path.startsWith("/gallery/")
        ) {
          setMeta({
            title:
              "Gallery | Perdana Kurniawan Arta",
            structuredTitle:
              "Gallery by Perdana Kurniawan Arta",
            description:
              "A visual archive of selected iconography, illustration, visual systems, graphic design, and product work by Perdana Kurniawan Arta.",
            url:
              `${SITE_URL}/gallery`,
            faviconUrl:
              "/perdanakun.ico",
            siteName:
              "Perdana Kurniawan Arta",
            type:
              "website",
            imageAlt:
              "Selected visual work by Perdana Kurniawan Arta"
          });

          return;
        }

        /* =====================================================
           WRITING
        ====================================================== */
        if (
          path === "/writing" ||
          path.startsWith("/writing/")
        ) {
          setMeta({
            title:
              "Writing | Perdana Kurniawan Arta",
            structuredTitle:
              "Writing by Perdana Kurniawan Arta",
            description:
              "Essays and notes by Perdana Kurniawan Arta about design practice, AI, career transitions, Product Design, technology, and learning to build.",
            url:
              `${SITE_URL}/writing`,
            faviconUrl:
              "/perdanakun.ico",
            siteName:
              "Perdana Kurniawan Arta",
            type:
              "website",
            imageAlt:
              "Writing by Perdana Kurniawan Arta"
          });

          return;
        }

        /* =====================================================
           ABOUT
        ====================================================== */
        if (
          path === "/about" ||
          path.startsWith("/about/")
        ) {
          setMeta({
            title:
              "About | Perdana Kurniawan Arta",
            structuredTitle:
              "About Perdana Kurniawan Arta",
            description:
              "About Perdana Kurniawan Arta, a Visual Designer and Design Lead with 10+ years of experience, now moving deeper into Product Design and Design Engineering.",
            url:
              `${SITE_URL}/about`,
            faviconUrl:
              "/perdanakun.ico",
            siteName:
              "Perdana Kurniawan Arta",
            type:
              "profile",
            imageAlt:
              "About Perdana Kurniawan Arta"
          });

          return;
        }

        /* =====================================================
           MAIN PORTFOLIO
        ====================================================== */
        setMeta({
          title:
            "Perdana Kurniawan Arta",
          structuredTitle:
            "Perdana Kurniawan Arta",
          description:
            "Perdana Kurniawan Arta is a designer with 10+ years of experience across visual systems, iconography, illustration, and design direction, now expanding into Product Design and Design Engineering through business thinking, interaction, React, and design in code.",
          url:
            `${SITE_URL}/`,
          faviconUrl:
            "/perdanakun.ico",
          siteName:
            "Perdana Kurniawan Arta",
          type:
            "profile",
          imageAlt:
            "Portfolio of Perdana Kurniawan Arta"
        });
      })();
    </script>

         MICROSOFT CLARITY
    ========================================================== -->

      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){
          (c[a].q=c[a].q||[]).push(arguments);

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
